<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a0d" />
  <title>Admin sign in — Aabha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin-login.css?v=2" />
  <link rel="stylesheet" href="admin-login-theme.css?v=1" />
  <script>if(sessionStorage.getItem('aabhaAdminSession')==='authenticated')location.replace('admin.html');</script>
</head>
<body>
  <header class="login-header"><a class="brand" href="index.html">✳ aabha<span>.</span></a><a class="store-link" href="index.html">Back to storefront ↗</a></header>
  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">AABHA PRODUCT MANAGER</p>
      <h1 id="login-title">Welcome <em>back.</em></h1>
      <p class="login-intro">Sign in to manage sarees, prices, photos, and stock.</p>
      <form id="admin-login-form">
        <label class="login-field">Username<input id="admin-username" name="username" type="text" autocomplete="username" required /></label>
        <label class="login-field">Password<input id="admin-password" name="password" type="password" autocomplete="current-password" required /></label>
        <button class="login-submit" type="submit">Sign in to manager <span>↗</span></button>
        <p class="login-status" id="login-status" aria-live="polite" role="status"></p>
      </form>
      <aside class="demo-credentials"><strong>Local demo login</strong><span>Username: <code>aabhaadmin</code></span><span>Password: <code>AabhaDemo</code></span><button id="use-demo" type="button">Fill demo login</button></aside>
      <p class="local-note">Demo sign-in is saved for this browser tab only.</p>
    </section>
  </main>
  <script src="admin-login.js?v=1"></script>
</body>
</html>
